name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Frontend Bundle
        run: |
          cd frontend
          npm install
          npm run build
          cd ..

      - name: Install Python Dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pyinstaller

      - name: Build Windows Standalone Executable
        run: |
          pyinstaller --noconfirm --clean --onefile --noconsole --name "Emris-AI-Desktop-v1.2-Beta" --add-data "frontend/dist;frontend/dist" --add-data "backend/prompts;backend/prompts" backend/main.py

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Emris-AI-Desktop-v1.2-Beta.exe
          name: Emris AI Desktop ${{ github.ref_name }}
          prerelease: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
